version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cocodi_db
    environment:
      # Inyectamos las variables del .env
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      # Volumen NUEVO para Producción (aislado de dev)
      - cocodi_prod_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: cocodi_backend
    build: .
    ports:
      - "5001:5001"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Declaramos el nuevo volumen persistente
  cocodi_prod_data: