version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cocodi_db
    environment:
        - POSTGRES_USER=cocodi_user
        - POSTGRES_PASSWORD=new_password_2025
        - POSTGRES_DB=cocodi_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocodi_user -d cocodi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: cocodi_backend
    build: .
    ports:
      - "5001:5001"
    # --- CORRECCIÓN CRÍTICA ---
    # Eliminamos la línea '- .:/app'. Ya no intentaremos sincronizar en vivo.
    # Confiaremos en los archivos copiados por el Dockerfile durante el 'build'.
    volumes:
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://cocodi_user:new_password_2025@db:5432/cocodi_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: